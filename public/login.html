<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authentication - Mobiles Apps features</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="icon" type="image/svg+xml" href="images/svg/favicon.svg">
   
  <script src="js/common.js"></script>
  <link rel="stylesheet" href="css/login-style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <i class="bi bi-phone brand-icon"></i>
                <div>
                    <div class="fw-bold">Mobile Apps Features</div>
                    <small class="text-muted d-none d-md-block" style="font-size: 0.7rem;">IT Solutions Services</small>
                </div>
            </a>
    
            <div class="d-flex gap-2 align-items-center">
                <button class="btn theme-toggle" onclick="toggleTheme()" title="Changer le thème">
                    <span id="themeIcon">🌓</span>
                </button>
            </div>
        </div>
    </nav>
    <div class="main">
        <div class="login-card">
            <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill" style="font-size: 2rem; color: #0d6efd;"></i>
            <h2 class="mt-2">Connexion</h2>
            <p class="text-muted">Accédez à l'espace administrateur</p>
            </div>

            <form action="/login" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Utilisateur</label>
                <input type="text" class="form-control" id="username" name="username" required placeholder="Votre identifiant">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="Votre mot de passe">
            </div>

            <button type="submit" class="btn btn-primary w-100">Se connecter</button>
            </form>

            <div class="text-center mt-3">
                <a href="/" class="text-decoration-none">&larr; Retour à l'accueil</a>
            </div>
        </div>
    </div>

  

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
   
</body>
</html>
