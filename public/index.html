<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile Apps Features</title>
  
  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
   <link rel="icon" type="image/svg+xml" href="images/svg/favicon.svg">
  <script src="js/app.js"></script>
  <script src="js/common.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/home-style.css">
</head>
<body>

<!-- Navbar -->
 <div id="navbar-container"></div>


<!-- Hero Section -->
<section class="hero-section">
  <!-- Animated background -->
  <div class="hero-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="container">
    <!-- Status Card -->
    <div class="status-card mx-auto text-center">
      <div class="status-icon" id="statusIcon">
        <div class="status-loading"></div>
      </div>
      
      <h1 class="status-text mb-3">Statut du Serveur</h1>
      
      <p id="statusMessage" class="text-muted mb-4">
        Vérification du serveur en cours...
      </p>
      
      <div id="statusDetails" class="mb-4 d-none">
        <div class="d-flex justify-content-center gap-4 flex-wrap">
          <div>
            <small class="text-muted d-block">Version</small>
            <strong id="apiVersion">-</strong>
          </div>
          <div>
            <small class="text-muted d-block">Node</small>
            <strong id="apiNodeVersion">-</strong>
          </div>
          <div>
            <small class="text-muted d-block">Uptime</small>
            <strong id="apiUptime">-</strong>
          </div>
          <div>
            <small class="text-muted d-block">Statut</small>
            <span id="apiStatus" class="badge bg-secondary">-</span>
          </div>
        </div>
      </div>
      
      <button class="btn btn-modern" onclick="checkStatus()">
        <i class="bi bi-arrow-clockwise me-2"></i>
        Vérifier l'API
      </button>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid" id="statsGrid" style="display: none;">
      <div class="stat-card">
        <div class="stat-icon">📊</div>
        <div class="stat-value" id="statRequests">0</div>
        <div class="stat-label">Requêtes traitées</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon">⚡</div>
        <div class="stat-value" id="statLatency">0ms</div>
        <div class="stat-label">Latence moyenne</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon">🎯</div>
        <div class="stat-value" id="statSuccess">100%</div>
        <div class="stat-label">Taux de succès</div>
      </div>
    </div>
  </div>
</section>

<div id="footer"></div>
 
<!-- Toast Container -->
<div class="toast-notification" id="toastContainer"></div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<script>
  initialize();
</script>

</body>
</html>
