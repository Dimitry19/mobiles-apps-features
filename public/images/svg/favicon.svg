<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="phoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGradient)" />
  
  <!-- Mobile phone icon -->
  <g transform="translate(50, 50)">
    <!-- Phone body -->
    <rect x="-15" y="-25" width="30" height="50" rx="4" ry="4" 
          fill="url(#phoneGradient)" stroke="#667eea" stroke-width="1.5" 
          filter="url(#glow)" />
    
    <!-- Screen -->
    <rect x="-12" y="-20" width="24" height="32" rx="2" ry="2" 
          fill="#667eea" opacity="0.3" />
    
    <!-- Camera dot -->
    <circle cx="0" cy="-22" r="1.5" fill="#667eea" />
    
    <!-- Home button -->
    <circle cx="0" cy="18" r="2.5" fill="none" stroke="#667eea" stroke-width="1.5" />
    
    <!-- Toggle/Feature icon -->
    <g transform="translate(0, -5)">
      <!-- Toggle switch OFF part -->
      <rect x="-8" y="-3" width="16" height="6" rx="3" ry="3" 
            fill="#4facfe" opacity="0.6" />
      <!-- Toggle switch ON part -->
      <circle cx="5" cy="0" r="4" fill="#00f2fe" filter="url(#glow)" />
      
      <!-- Small sparkle effect -->
      <circle cx="5" cy="0" r="2" fill="#ffffff" opacity="0.8" />
    </g>
  </g>
  
  <!-- Decorative elements - small dots for tech feel -->
  <circle cx="20" cy="20" r="2" fill="#ffffff" opacity="0.3" />
  <circle cx="80" cy="25" r="1.5" fill="#ffffff" opacity="0.4" />
  <circle cx="85" cy="75" r="2" fill="#ffffff" opacity="0.3" />
  <circle cx="15" cy="80" r="1.5" fill="#ffffff" opacity="0.4" />
</svg>